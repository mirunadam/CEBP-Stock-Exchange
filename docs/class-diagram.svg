g<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1020" viewBox="0 0 680 510" font-family="Arial, Helvetica, sans-serif">
<title>Class diagram of the correct stock exchange</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="510" fill="#FFFFFF"/>
<g fill="none" stroke="#5F5E5A" stroke-width="1.2">
<line x1="120" y1="96" x2="120" y2="168" marker-end="url(#arrow)"/>
<path d="M200 68 H450 V128" marker-end="url(#arrow)"/>
<line x1="200" y1="198" x2="258" y2="198" marker-end="url(#arrow)"/>
<line x1="305" y1="272" x2="305" y2="328" marker-end="url(#arrow)"/>
<line x1="450" y1="272" x2="450" y2="328" marker-end="url(#arrow)"/>
<line x1="595" y1="272" x2="595" y2="328" marker-end="url(#arrow)"/>
<line x1="305" y1="386" x2="305" y2="428" marker-end="url(#arrow)"/>
<path d="M240 358 H222 V250 H258" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</g>
<g font-size="12" fill="#5F5E5A">
<text x="128" y="136">starts 16 threads</text>
<text x="325" y="60" text-anchor="middle">creates</text>
<text x="312" y="304">has 4</text>
<text x="457" y="304">has 16</text>
<text x="602" y="304">history</text>
<text x="312" y="411">has many</text>
<text x="214" y="304" text-anchor="end">match() calls</text>
<text x="214" y="322" text-anchor="end">transfer()</text>
</g>
<rect x="40" y="40" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<rect x="40" y="170" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<rect x="260" y="130" width="380" height="140" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<rect x="240" y="330" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<rect x="385" y="330" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="530" y="330" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<rect x="240" y="430" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<g font-size="14" font-weight="bold" text-anchor="middle">
<text x="120" y="63" fill="#2C2C2A">Main</text>
<text x="120" y="193" fill="#2C2C2A">Trader x16</text>
<text x="450" y="155" fill="#3C3489">Exchange</text>
<text x="305" y="353" fill="#085041">OrderBook x4</text>
<text x="450" y="353" fill="#712B13">Account x16</text>
<text x="595" y="353" fill="#712B13">Trade</text>
<text x="305" y="453" fill="#085041">Order</text>
</g>
<g font-size="12" text-anchor="middle">
<text x="120" y="82" fill="#5F5E5A">Start, stop, check</text>
<text x="120" y="212" fill="#5F5E5A">One thread each</text>
<text x="305" y="372" fill="#0F6E56">synchronized</text>
<text x="450" y="372" fill="#993C1D">synchronized</text>
<text x="595" y="372" fill="#993C1D">immutable record</text>
<text x="305" y="472" fill="#0F6E56">price, quantity</text>
</g>
<g font-size="12" fill="#534AB7">
<text x="280" y="180">books, accounts: maps that never change</text>
<text x="280" y="200">orderIds, tradeIds: AtomicLong</text>
<text x="280" y="220">history: ConcurrentLinkedQueue of Trade</text>
<text x="280" y="240">open: volatile boolean</text>
<text x="280" y="260">transfer(): locks 2 Accounts, adds Trade</text>
</g>
</svg>
